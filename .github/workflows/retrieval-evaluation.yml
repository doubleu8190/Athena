name: retrieval-evaluation

on:
  pull_request:
    paths:
      - "backend/src/domain/evaluation/**"
      - "backend/src/application/evaluation/**"
      - "backend/src/infrastructure/evaluation/**"
      - "backend/src/interfaces/http/controllers/evaluation_controller.py"
      - "backend/src/infrastructure/persistence/postgres/models/evaluation_models.py"
      - "backend/src/infrastructure/persistence/postgres/repositories/evaluation_repository.py"
      - "backend/scripts/evaluate*.py"
      - "backend/configs/evals/**"
      - "backend/tests/unit/test_evaluation_*.py"
      - "frontend/src/components/pages/EvaluationView.tsx"

jobs:
  protocol-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "backend[dev]"
      - run: PYTHONPATH=backend/src python -m compileall -q backend/src/domain/evaluation backend/src/application/evaluation backend/src/infrastructure/evaluation
      - run: cd backend && PYTHONPATH=src python -m pytest -q tests/unit/test_evaluation_system.py tests/architecture/test_layer_boundaries.py
      - run: cd backend && PYTHONPATH=src python -m scripts.evaluate run --config configs/evals/smoke.yaml --output /tmp/athena-evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: athena-evaluation-smoke
          path: /tmp/athena-evaluation/**
