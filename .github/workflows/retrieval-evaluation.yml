name: retrieval-evaluation

on:
  pull_request:
    paths:
      - "athena/evaluation/**"
      - "athena/core/memory/**"
      - "athena/core/retrieval/**"
      - "doc/retrieval-evaluation/**"
      - "tests/test_evaluation_*.py"

jobs:
  protocol-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q athena/evaluation
      - run: pytest tests/test_evaluation_*.py
