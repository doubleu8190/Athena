[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-restructured"
version = "0.1.0"
description = "Athena - autonomous AI Agent desktop application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain==1.4.0",
    "langchain-core==1.6.2",
    "langchain-openai==1.6.0",
    "langchain-anthropic==1.7.1",
    "langchain-community==0.4.2",
    "langchain-ollama==1.1.0",
    "langsmith>=0.3.0",
    "tiktoken>=0.7.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=24.0.0",
    "mcp>=1.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "rapidocr_onnxruntime>=1.2.0",
    "tree-sitter-language-pack>=0.8.0",
    "pandas>=2.2.0",
    "neo4j>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools]
packages = ["backend"]
package-dir = {backend = "."}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires ATHENA_TEST_DATABASE_URL and a reachable PostgreSQL instance",
]
