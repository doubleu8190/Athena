name: athena-test-deps

services:
  postgres:
    build:
      context: ./docker/postgres
    image: athena-test-postgres:18.6-pgvector-0.8.7-zhparser
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-athena_test}
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    secrets:
      - postgres_user
      - postgres_password
    healthcheck:
      test: ["CMD", "/usr/local/bin/athena-postgres-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    build:
      context: ./docker/minio
    image: athena-test-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    secrets:
      - minio_root_user
      - minio_root_password
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    build:
      context: ./docker/minio-init
    image: athena-test-minio-init:2.31.13
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: us-east-1
      MINIO_DEV_BUCKET: ${MINIO_DEV_BUCKET:-athena-knowledge-dev}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET:-athena-knowledge-test}
    command:
      - |
        # MinIO 已健康后分别创建私有开发桶和测试桶，保持对象存储数据隔离。
        attempt=0
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then echo 'MinIO 未在 60 秒内就绪' >&2; exit 1; fi
          sleep 1
        done
        for bucket in "$$MINIO_DEV_BUCKET" "$$MINIO_TEST_BUCKET"; do
          if ! aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1; then
            aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$$bucket"
          fi
        done
    restart: "no"

    secrets:
      - minio_root_user
      - minio_root_password

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
