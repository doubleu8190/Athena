# ==============================================================================
# Athena v2 生产环境容器编排配置 (Docker Compose)
# ------------------------------------------------------------------------------
# 业务范围：仅编排 Athena 项目自身的前后端代码服务（frontend, backend-api, backend-worker）
# 外部依赖（PostgreSQL、Redis、MinIO）均由外部基础设施提供，并通过环境变量或 .env 注入连接
# ==============================================================================

name: athena

# 通用后端环境变量定义（通过 YAML Anchor 避免在 API 与 Worker 间冗余重复）
x-backend-environment: &backend-environment
  # 核心数据库连接：支持标准 PostgreSQL+asyncpg（需包含 pgvector 与 zhparser 扩展）
  ATHENA_DATABASE_URL: ${ATHENA_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/athena}
  ATHENA_DATABASE_POOL_SIZE: ${ATHENA_DATABASE_POOL_SIZE:-5}
  ATHENA_DATABASE_MAX_OVERFLOW: ${ATHENA_DATABASE_MAX_OVERFLOW:-10}

  # Redis 临时事件传输与 Pub/Sub 订阅
  ATHENA_REDIS_URL: ${ATHENA_REDIS_URL:-redis://host.docker.internal:6379/0}

  # MCP 协议凭据加密主密钥（32 字节 Base64 编码字符串）
  # 生成命令: python -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())'
  ATHENA_MCP_SECRET_KEY: ${ATHENA_MCP_SECRET_KEY:-}
  ATHENA_MCP_SECRET_KEY_VERSION: ${ATHENA_MCP_SECRET_KEY_VERSION:-1}
  ATHENA_MCP_ALLOWED_PRIVATE_HOSTS: ${ATHENA_MCP_ALLOWED_PRIVATE_HOSTS:-}
  ATHENA_MCP_STDIO_BASE_ENV_NAMES: ${ATHENA_MCP_STDIO_BASE_ENV_NAMES:-}

  # 安全与同源校验配置：
  # 若生产环境部署在反向代理 HTTPS 之后，请将 ATHENA_COOKIE_SECURE 设置为 true
  ATHENA_COOKIE_SECURE: ${ATHENA_COOKIE_SECURE:-false}
  # 允许跨域写请求的规范 Origin，未设置时后端默认使用请求自身的 scheme://netloc
  ATHENA_PUBLIC_ORIGIN: ${ATHENA_PUBLIC_ORIGIN:-http://localhost}

  # 技能脚本运行时可写目录
  ATHENA_SKILL_TEMP_ROOT: ${ATHENA_SKILL_TEMP_ROOT:-/app/var/skill-executions}

  # 对象存储：会话附件与技能文件存储（私有 MinIO / S3）
  ATHENA_FILES_ENABLED: ${ATHENA_FILES_ENABLED:-false}
  ATHENA_FILE_MINIO_ENDPOINT: ${ATHENA_FILE_MINIO_ENDPOINT:-}
  ATHENA_FILE_MINIO_ACCESS_KEY: ${ATHENA_FILE_MINIO_ACCESS_KEY:-}
  ATHENA_FILE_MINIO_SECRET_KEY: ${ATHENA_FILE_MINIO_SECRET_KEY:-}
  ATHENA_FILE_MINIO_BUCKET: ${ATHENA_FILE_MINIO_BUCKET:-}
  ATHENA_FILE_MINIO_SECURE: ${ATHENA_FILE_MINIO_SECURE:-false}

  # 对象存储：知识库文档与向量索引存储（私有 MinIO / S3）
  ATHENA_KNOWLEDGE_ENABLED: ${ATHENA_KNOWLEDGE_ENABLED:-false}
  ATHENA_KNOWLEDGE_MINIO_ENDPOINT: ${ATHENA_KNOWLEDGE_MINIO_ENDPOINT:-}
  ATHENA_KNOWLEDGE_MINIO_ACCESS_KEY: ${ATHENA_KNOWLEDGE_MINIO_ACCESS_KEY:-}
  ATHENA_KNOWLEDGE_MINIO_SECRET_KEY: ${ATHENA_KNOWLEDGE_MINIO_SECRET_KEY:-}
  ATHENA_KNOWLEDGE_MINIO_BUCKET: ${ATHENA_KNOWLEDGE_MINIO_BUCKET:-}
  ATHENA_KNOWLEDGE_MINIO_SECURE: ${ATHENA_KNOWLEDGE_MINIO_SECURE:-false}

  # 结构化应用日志级别
  ATHENA_LOG_LEVEL: ${ATHENA_LOG_LEVEL:-INFO}

  # HuggingFace 模型镜像加速端点（支持国内访问或网络受限环境）
  HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}

services:
  # ============================================================================
  # 1. 前端静态托管与反向代理服务 (Frontend & Gateway)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: athena-frontend:latest
    container_name: athena-frontend
    ports:
      # 对外暴露 Web 统一访问端口，默认 80 端口，可通过宿主机环境变量 PORT 覆盖
      - "${PORT:-80}:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - athena-network

  # ============================================================================
  # 2. 后端 API 核心服务 (Backend API)
  # ============================================================================
  backend-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        INSTALL_KNOWLEDGE: ${ATHENA_INSTALL_KNOWLEDGE:-false}
    image: athena-backend:latest
    container_name: athena-backend-api
    command: ["api"]
    expose:
      - "8000"
    # 可选：如需从宿主机直接调试后端端口，可按需开启以下端口映射：
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      # Linux Docker 宿主机网络穿透，支持通过 host.docker.internal 访问宿主机服务
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend-environment
    volumes:
      # 挂载工作运行时临时目录以持久化临时脚本输出与模型缓存
      - athena-var:/app/var
      # 挂载宿主机 HuggingFace 模型缓存，避免重复下载与网络阻断
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro
    healthcheck:
      # 检查存活端点 /health，确保进程就绪后前端再接入流量
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - athena-network

  # ============================================================================
  # 3. 后端异步任务调度 Worker (Backend Worker)
  # ============================================================================
  backend-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        INSTALL_KNOWLEDGE: ${ATHENA_INSTALL_KNOWLEDGE:-false}
    image: athena-backend:latest
    container_name: athena-backend-worker
    command: ["worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend-environment
      # Worker 专属并发与执行租约参数
      ATHENA_RUN_WORKER_CONCURRENCY: ${ATHENA_RUN_WORKER_CONCURRENCY:-4}
      ATHENA_RUN_LEASE_SECONDS: ${ATHENA_RUN_LEASE_SECONDS:-30}
      ATHENA_RUN_HEARTBEAT_SECONDS: ${ATHENA_RUN_HEARTBEAT_SECONDS:-5}
      ATHENA_RUN_EXECUTION_SECONDS: ${ATHENA_RUN_EXECUTION_SECONDS:-300}
      ATHENA_RUN_CANCEL_POLL_SECONDS: ${ATHENA_RUN_CANCEL_POLL_SECONDS:-1}
      ATHENA_RUN_QUEUE_POLL_SECONDS: ${ATHENA_RUN_QUEUE_POLL_SECONDS:-1}
      ATHENA_RUN_RECLAIM_SECONDS: ${ATHENA_RUN_RECLAIM_SECONDS:-5}
    volumes:
      - athena-var:/app/var
      # 挂载宿主机 HuggingFace 模型缓存，避免重复下载与网络阻断
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - athena-network

  # ============================================================================
  # 4. 可选数据库迁移辅助服务 (Database Migration Profile)
  # ============================================================================
  # 执行方式：docker compose run --rm backend-migration
  # 也可通过已有容器直接执行：docker compose run --rm backend-api migrate
  backend-migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        INSTALL_KNOWLEDGE: ${ATHENA_INSTALL_KNOWLEDGE:-false}
    image: athena-backend:latest
    command: ["migrate"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend-environment
    profiles:
      - migration
    restart: "no"
    networks:
      - athena-network

networks:
  athena-network:
    driver: bridge

volumes:
  athena-var:
    driver: local
