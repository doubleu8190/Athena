# llm.yaml — LLM Provider configuration
#
# Two models only:
#   default_provider         — strong model for main agent tasks
#   default_summarize_provider — fast/cheap model for message summarization
#
# The system auto-detects OpenAI vs Anthropic format by provider name prefix.
# LangChain handles all message format conversion automatically.

default_provider: mimo-v2.5-pro
default_summarize_provider: deepseek-v4-flash

providers:
  mimo-v2.5-pro:
    api_key_env: mimo_api_key
    base_url: https://api.xiaomimimo.com/v1
    model: mimo-v2.5-pro
    format: openai
  deepseek-v4-flash:
    api_key_env: deepseek_api_key
    base_url: https://api.deepseek.com/v1
    model: deepseek-v4-flash
    format: openai
