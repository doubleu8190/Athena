# llm.yaml — LLM Provider configuration
# Only providers with native Function Calling support are compatible.

default_provider: deepseek-v4-flash      # 主 LLM：强模型
default_summarize_provider: deepseek-v4-flash  # 摘要：快模型

# Optional: dedicated provider for message summarization (cheaper/faster).
# When omitted, ``default_provider`` is used for summarization as well.
# default_summarize_provider: deepseek-v4-flash

fallback_chain:
  - deepseek-v4-pro
  - openai
  - anthropic
  - litellm

providers:
  deepseek-v4-flash:
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    model: deepseek-v4-flash
    max_tokens: 4096
    temperature: 0.7
  deepseek-v4-pro:
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    model: deepseek-v4-pro
    max_tokens: 4096
    temperature: 0.7
