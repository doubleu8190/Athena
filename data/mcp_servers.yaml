# mcp_servers.yaml — MCP Server seed configuration
# This file is ONLY used as an initialization seed when the database is empty.
# Runtime modifications must be made via the Admin API.
# The file will NOT be re-read after initial import.

servers:
  - server_id: builtin-core
    name: Athena Built-in Tools
    transport: stdio
    connection_config:
      command: python -m athena.tools.server
    source: builtin

  - server_id: rag-skill
    name: Athena RAG Skill
    transport: stdio
    connection_config:
      command: python -m athena.tools.rag_server
    source: builtin

  - server_id: weather
    name: Weather Query
    transport: stdio
    connection_config:
      command: python -m athena.tools.weather_server
    source: builtin

  - server_id: chrome-devtools
    name: Chrome DevTools
    transport: stdio
    connection_config:
      command: npx -y chrome-devtools-mcp@latest --slim --headless
    source: external
