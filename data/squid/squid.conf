# Squid proxy configuration for Skill network isolation
# ACL fragments for individual skills are in /etc/squid/acl/*.conf
# and included dynamically.

http_port 3128

# Default: deny all
http_access deny all

# Include per-skill ACL rules
include /etc/squid/acl/*.conf

# Logging
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
