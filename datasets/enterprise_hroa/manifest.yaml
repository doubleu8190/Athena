  - code: PROJ-2
    owner_actor: mock_fin_admin
    name: 2026年11月差旅稽核与用印风控专项
    description: 林清岚（财务部负责人）牵头的 2026-11 月度差旅报销超标审计、离职备用金阻断及大额合同财务会签风控专项。
    instructions: >-
      本项目聚焦星辰智联 2026 年 11 月财务关账（28 日）前两项核心风控：
      1. 差旅与备用金稽核严格执行 XC-FIN-2026-006、XC-FIN-INT-020 与 XC-FIN-TRV-021：一线住宿上限 650.00 元/晚、二线 450.00 元/晚、餐补 120.00 元/天、严控未特批公务舱，并紧盯韩景明（XC1003）未核销备用金 FIN-ADV-2026-0914（2,400.00 元）；
      2. 合同用印会签严格执行 XC-LEG-2026-008：金额 100,000.01–500,000.00 元（如 CTR-2026-1120 360,000.00 元）须核验 LEG-REV 法务初审号后完成财务会签，超 500,000.00 元或含排他/无限连带条款须提报周明远（MOCK001）终审；
      3. 所有金额统一按人民币两位小数列示并附计算公式。
    default_skill_codes:
      - SK-7
      - SK-8
    knowledge_base_keys:
      - kb_company_policies
      - kb_finance_collab

