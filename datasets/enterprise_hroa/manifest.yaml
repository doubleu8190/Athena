preferences_and_memories:
  - user_id: mock_super_admin
    memory_enabled: true
    custom_instructions: >-
      我是星辰智联集团总部行政与平台总负责人周明远（MOCK001）。请以管理层简报风格回复：先给结论与风险项，再给制度依据编号（如 XC-HR-2026-001）与待批事项清单，数字保留两位小数并标注单位。
    manual_memories:
      - 审批全公司跨部门流程时，重点关注是否存在 IT 资产未还或财务备用金未核销等硬性阻断项。
      - 月度高管例会固定在每月最后一个工作日下午 15:00 召开，汇总材料需提前一天提交。
      - 制度引用请同时标注制度编号与关键生效日期，便于审计留痕。

  - user_id: mock_fin_admin
    memory_enabled: true
    custom_instructions: >-
      我是星辰智联财务部负责人林清岚（MOCK002）。分析离职清算、差旅报销与异动成本归属时，请严格遵循 XC-FIN-2026-006 与 XC-FIN-INT-020，金额统一按人民币两位小数列示并注明计算公式。
    manual_memories:
      - 财务部每月末 28 日关账，所有离职员工备用金冲账必须在最后工作日 T-3 前完成。
      - 郑语桐（XC1004）拟于 2026-12-01 平调至人力资源部，12 月起人力成本划转至人力资源部成本中心。
      - 复核病假扣薪与事假扣款时，固定使用 21.75 天作为月计薪除数。

  - user_id: mock_rd_admin
    memory_enabled: true
    custom_instructions: >-
      我是研发部负责人顾行知（MOCK003），分管研发部及平台架构组。回复请结构化、直奔要点，涉及人员试用期转正、入职配机、权限回收或休假替补时，自动提醒对应导师或交接人。
    manual_memories:
      - 平台架构组新入职高级后端工程师陈思远（XC1001）由陆知微（MOCK005）担任入职导师，报到日为 2026-12-01。
      - 前端工程师许知夏（XC1002）6 个月试用期将于 2026-11-30 到期，需尽快完成转正答辩评估。
      - 韩景明（XC1003）离职交接期间，生产集群运维已移交陆知微，最后工作日 18:00 务必回收堡垒机与 GitLab 权限。

  - user_id: mock_fin_member
    memory_enabled: false
    custom_instructions: >-
      我是财务部高级财务专员沈佳禾（MOCK004），负责差旅报销审核与备用金台账核销。请用表格列出待核销单号、金额及制度条款，语气保持严谨简洁。
    manual_memories:
      - 常用差旅单审核口径：一线城市普通员工住宿上限 650 元/晚，二线城市 450 元/晚。
      - 当前重点跟踪韩景明（XC1003）未核销备用金单号 FIN-ADV-2026-0914，金额 2,400.00 元。

  - user_id: mock_rd_member
    memory_enabled: true
    custom_instructions: >-
      我是平台架构组架构师陆知微（MOCK005）。回复尽量简洁高效，涉及个人请假、值班调休或带教新人事项时，优先给出可执行步骤与具体日期。
    manual_memories:
      - 我目前担任新人陈思远（XC1001）的入职导师，需要在 2026-12-01 首周安排代码库与架构串讲。
      - 我已承接韩景明（XC1003）的 K8s 集群与发布流水线运维工作交接。

  - user_id: mock_hr_member
    memory_enabled: true
    custom_instructions: >-
      我是星辰智联 HRBP 苏晚晴（MOCK006），负责员工入转调离全流程支持与假勤合规核验。请先核对制度条款与实时 HR/OA 系统数据，对存在阻断项或余额不足的情况用醒目列表标出风险与合规建议。
    manual_memories:
      - 回复员工制度咨询时，优先给出结论、对应制度编号与办理路径，避免冗长套话。
      - 处理请假余额不足场景时，按 XC-HR-2026-001 规则主动给出“年假 + 调休 + 事假”拆分方案。
      - 每月 25 日需使用 hroa-lifecycle-audit-pack 技能生成全员入转调离月度稽核台账并汇总高风险阻断项。

