    description: 苏晚晴（HRBP）负责的 2026Q4 全员绩效校准、PIP/申诉跟踪与月度入转调离风控稽核专项工作区。
    instructions: >-
      本项目聚焦星辰智联 2026Q4（基准日 2026-11-24）人力资源核心专项：
      1. 绩效校准窗口（2026-11-20 至 2026-12-05）严格执行 XC-HR-2026-007 与 XC-HR-PERF-011，重点跟进 XC1008 方若琳 C 档 60 天 PIP 与 2026-12-02 申诉截止日，确认 XC1004 郑语桐（A）平调与 XC1007 唐逸凡（S）晋升资格，严禁对 XC1001/XC1002/XC1006 调档；
      2. 入转调离风险清查严格遵循 XC-HR-2026-003 与 XC-HR-OPS-010，韩景明（XC1003）四项清查未全部 cleared 前绝不开具离职证明；
      3. 回复请优先标明制度编号、员工工号及具体合规处置步骤。
    default_skill_codes:
      - SK-5
      - SK-9
    knowledge_base_keys:
      - kb_hr_ops
