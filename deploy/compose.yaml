services:
  neo4j:
    image: neo4j:5-community
    container_name: athena-neo4j
    restart: unless-stopped
    entrypoint: /usr/local/bin/athena-neo4j-entrypoint
    command: ["neo4j"]
    secrets:
      - neo4j_auth
    volumes:
      - ./neo4j/entrypoint.sh:/usr/local/bin/athena-neo4j-entrypoint:ro
      - ../data/neo4j:/data
      - ../data/neo4j-logs:/logs
      - ../data/neo4j-import:/import
      - ../data/neo4j-plugins:/plugins
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    build:
      context: ./postgres-fts
      dockerfile: Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-postgres:18.6-trixie}
        PGVECTOR_VERSION: ${PGVECTOR_VERSION:-0.8.1}
    image: doubleu8190/athena-postgres-zhparser
    container_name: athena-postgres-zhparser
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doubleu}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-athena}
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../data/postgresql:/var/lib/postgresql
      - ./postgres-fts/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    container_name: athena-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - ../data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

secrets:
  neo4j_auth:
    file: ./neo4j/secrets/neo4j_auth
  postgres_password:
    file: ./postgres-fts/secrets/postgres_password
