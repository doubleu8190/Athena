# Filebeat configuration — Athena container log collection
# Collects JSON logs from Docker containers, filters by app=athena label,
# and forwards to Logstash.
#
# Filebeat 9.x: container input is deprecated. Use filestream with container parser.

filebeat.inputs:
  - type: filestream
    id: athena-container-logs
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    parsers:
      - container:
          stream: all
          format: auto

    processors:
      # Enrich with Docker metadata (container name, image, labels, etc.)
      # Must be input-level in Filebeat 9.x to access container.id from the container parser.
      # match_source provides a fallback: extract container ID from the log file path.
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
          match_fields: ["container.id"]
          match_source: true

      # Keep only Athena application logs, discard infrastructure containers.
      # Only drop events that HAVE container labels but don't match app=athena.
      # Events without labels pass through rather than being silently discarded.
      # Filebeat 9.x stores labels under container.labels (not docker.container.labels).
      - drop_event:
          when:
            and:
              - has_fields: ["container.labels"]
              - not:
                  regexp:
                    container.labels.app: "athena"

output.logstash:
  hosts: ["logstash:5044"]
  loadbalance: true

logging.level: info
logging.to_files: false
