# Logstash pipeline: Application logs from Filebeat -> Elasticsearch
input {
  beats {
    port => 5044
  }
}

filter {
  # Parse structlog JSON from the Docker log message.
  # The container parser in Filebeat unwraps the Docker JSON wrapper,
  # leaving the structlog JSON string in the "message" field.
  # This filter decodes it into root-level fields (event, level, logger, timestamp, etc.).
  json {
    source => "message"
    target => ""
    skip_on_invalid_json => true
  }

  # Use structlog's timestamp field as @timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Remove redundant fields to reduce index size
  prune {
    whitelist_names => [
      "@timestamp", "event", "level", "logger",
      "session_id", "task_id", "step",
      "tool_name", "mcp_server_id", "status",
      "fallback_used", "fallback_from",
      "duration_ms", "input_args", "output_preview",
      "token_usage", "error", "traceback",
      "docker", "host", "message", "container", "stream"
    ]
  }

  # Severity mapping for Kibana coloring
  translate {
    field => "level"
    destination => "[log][level]"
    dictionary => {
      "debug"   => "DEBUG"
      "info"    => "INFO"
      "warning" => "WARN"
      "error"   => "ERROR"
      "critical"=> "CRITICAL"
    }
    fallback => "INFO"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "athena-logs-%{+YYYY.MM.dd}"
  }
}
