services:
  postgres:
    image: doubleu8190/athena-postgres-zhparser
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-postgres:18.6-trixie}
    container_name: athena-postgres-zhparser
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doubleu}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-athena}
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../../data/postgresql:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

secrets:
  postgres_password:
    file: ./secrets/postgres_password
