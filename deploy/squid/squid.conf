# Base Squid configuration template for skill-proxy
# This file is mounted to the skill-proxy container at /etc/squid/squid.conf

http_port 3128

# Access control
acl SSL_ports port 443
acl Safe_ports port 80 21 443 70 210 280 488 591 777 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Default deny
http_access deny all

# Include per-skill ACL fragments (dynamically managed by Skill Manager)
include /etc/squid/acl/*.conf

# Cache settings
cache_mem 64 MB
maximum_object_size 4 MB

# Logging
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
