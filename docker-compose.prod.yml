# docker-compose.prod.yml — Athena Production Deployment
#
# Services:
#   redis           — Session cache
#   athena-core     — FastAPI application (API + Core engine + embedded ARQ worker)
#   skill-proxy     — Squid proxy for skill network isolation
#
# Note: Frontend is handled by the Electron desktop app.
# The athena-core service exposes port 8000 directly for Electron access.
#
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Scaling:
#   docker compose -f docker-compose.prod.yml up -d --scale athena-core=3

services:
  # ── Infrastructure ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── Athena Core ────────────────────────────────────────────────────
  athena-core:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - SQLITE_DB_PATH=/data/athena.db
      - REDIS_URL=redis://redis:6379/0
      - ARQ_BROKER_URL=redis://redis:6379/1
      - ARQ_EMBEDDED=true
      - TELEGRAM_POLL_TIMEOUT=30
      - USER_CONFIG_PATH=/data/user.yaml
      - SYSTEM_CONFIG_PATH=/data/athena.yaml
      - MCP_SERVERS_CONFIG=/data/mcp_servers.json
      - LLM_CONFIG_PATH=/data/llm.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROMETHEUS_ENABLED=true
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - HF_HOME=/data/huggingface
    volumes:
      - athena-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/prompt:/data/prompt
      - ./deploy/core/user.yaml:/data/user.yaml
      - ./deploy/core/athena.yaml:/data/athena.yaml
      - ./deploy/core/mcp_servers.json:/data/mcp_servers.json
      - ./deploy/core/llm.yaml:/data/llm.yaml
    secrets:
      - admin_api_key
      - device_psk
      - telegram_bot_token
      - wechat_bot_token
      - wechat_ilink_bot_id
      - mimo_api_key
      - deepseek_api_key
      - athena_encryption_key
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "alembic upgrade head && uvicorn athena.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-4}"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "app=athena"
      - "component=core"
    deploy:
      replicas: ${ATHENA_CORE_REPLICAS:-1}
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Skill Proxy (Squid) ───────────────────────────────────────────
  skill-proxy:
    image: ubuntu/squid:latest
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - squid-data:/var/spool/squid
      - ./deploy/squid/squid.conf:/etc/squid/squid.conf
      - ./data/squid/acl/:/etc/squid/acl/
    ports:
      - "3128:3128"
    networks:
      - skill-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

# ── Networks ────────────────────────────────────────────────────────
networks:
  default:
    driver: bridge
    name: athena-network
  skill-net:
    driver: bridge
    name: athena-skill-network

# ── Volumes ────────────────────────────────────────────────────────
volumes:
  redis-data:
    driver: local
    name: athena-redis-data
  athena-data:
    driver: local
    name: athena-data
  squid-data:
    driver: local
    name: athena-squid-data

# ── Docker Compose Secrets ──────────────────────────────────────────
# Each secret maps to a file under ./secrets/<name>.
# The file content is mounted at /run/secrets/<name> inside the container.
#
# Create the secret files before starting:
#   echo "your-key" > secrets/admin_api_key
#   chmod 600 secrets/*
#
# See secrets/example/ for a full list of expected secrets.
secrets:
  admin_api_key:
    file: ./secrets/admin_api_key
  device_psk:
    file: ./secrets/device_psk
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  wechat_bot_token:
    file: ./secrets/wechat_bot_token
  wechat_ilink_bot_id:
    file: ./secrets/wechat_ilink_bot_id
  mimo_api_key:
    file: ./secrets/mimo_api_key
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  athena_encryption_key:
    file: ./secrets/athena_encryption_key
