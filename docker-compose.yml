# docker-compose.yml — Athena development deployment
#
# Services:
#   redis           — Session cache + Celery broker/backend
#   athena-core     — FastAPI application (API + Core engine)
#   celery-worker   — Background task execution + recovery
#   skill-proxy     — Squid proxy for skill network isolation
# 为什么需要 Squid（必要性）
# Athena 的 Skill 容器默认无网络（network_mode: none），这是出于安全考虑——防止不可信的 Skill 镜像主动外连、泄露数据或发起攻击。但部分 Skill 确实需要访问外网（例如调用公开 API、下载资源），此时需要一种 最小权限、可审计、动态配置 的网络出口方案。
# 使用 Squid 的必要性体现在以下三点：
# 1. 域名级白名单控制
# 每个 Skill 安装时可指定 allowed_domains（如 api.github.com, raw.githubusercontent.com）。Squid 根据这些域名动态生成 ACL 规则，仅允许访问白名单内的域名，其他所有外连请求被拒绝。这比单纯限制 IP 或端口更精细、更贴近业务需求。
# 2. 统一代理与审计
# 所有 Skill 的出站流量都经过 Squid，Athena 可以在代理层记录请求日志（域名、时间、大小），便于事后审计和异常检测。同时避免为每个 Skill 单独配置 iptables 规则或网络 namespace，降低运维复杂度。
# 3. 热更新 ACL
# 当 Skill 安装或卸载时，Athena 会写入/删除 /etc/squid/acl/<skill_id>.conf，并执行 squid -k reconfigure 让 Squid 平滑加载新配置，无需重启容器或中断其他 Skill 的网络。这对于动态安装/卸载 Skill 的场景至关重要。
#   elasticsearch   — Log indexing and search (single node)
#   logstash        — Log aggregation, parsing, and routing
#   kibana          — Log visualization and dashboards
#   filebeat        — Docker container log collection
#   kibana-setup    — One-shot Kibana dashboard import

# docker compose -f 'docker-compose.yml' up -d --build
services:
  # ── Infrastructure ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data/redis:/data
      - /etc/localtime:/etc/localtime:ro
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Athena Core ────────────────────────────────────────────────────
  athena-core:
    # Prerequisite: Build the base image first — sh scripts/build-base.sh
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
      - SQLITE_DB_PATH=/data/athena.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - TELEGRAM_POLL_TIMEOUT=30
      - USER_CONFIG_PATH=/data/user.yaml
      - SYSTEM_CONFIG_PATH=/data/athena.yaml
      - MCP_SERVERS_CONFIG=/data/mcp_servers.yaml
      - LLM_CONFIG_PATH=/data/llm.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROMETHEUS_ENABLED=true
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - HF_HOME=/data/huggingface
    secrets:
      - admin_api_key
      - device_psk
      - telegram_bot_token
      - wechat_bot_token
      - wechat_ilink_bot_id
      - deepseek_api_key
      - openai_api_key
      - anthropic_api_key
      - athena_encryption_key
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "alembic upgrade head && uvicorn athena.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "app=athena"
      - "component=core"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Athena Frontend ─────────────────────────────────────────────────
  athena-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - athena-core
    labels:
      - "app=athena"
      - "component=frontend"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Athena Gateway (Nginx) ──────────────────────────────────────────
  athena-gateway:
    image: nginx:alpine
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - athena-core
      - athena-frontend
    restart: unless-stopped
    labels:
      - "app=athena"
      - "component=gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Worker ─────────────────────────────────────────────────
  celery-worker:
    build: .
    command: celery -A athena.worker worker -l info --concurrency=8
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
      - SQLITE_DB_PATH=/data/athena.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HF_HOME=/data/huggingface
    secrets:
      - admin_api_key
      - deepseek_api_key
      - openai_api_key
      - anthropic_api_key
      - athena_encryption_key
    labels:
      - "app=athena"
      - "component=worker"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Skill Proxy (Squid) ───────────────────────────────────────────
  skill-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data/squid/squid.conf:/etc/squid/squid.conf
      - ./data/squid/acl/:/etc/squid/acl/
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3128:3128"
    networks:
      - skill-net

  # ── Elasticsearch ─────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.monitoring.collection.enabled=true
      - http.cors.enabled=true
      - http.cors.allow-origin="*"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── Logstash ──────────────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.2
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - LS_OPTS=--pipeline.unsafe_shutdown
    volumes:
      - ./deploy/logstash/pipelines/:/usr/share/logstash/pipeline/
      - ./deploy/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./deploy/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml
      - ./data:/data:ro
      - ./deploy/logstash/drivers/:/usr/share/logstash/drivers/
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Kibana ────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - XPACK_SECURITY_ENABLED=false

    ports:
      - "5601:5601"
    volumes:
      - ./deploy/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Filebeat ──────────────────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:9.4.2
    restart: unless-stopped
    user: root
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./deploy/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    command: filebeat -e --strict.perms=false
    depends_on:
      - logstash

networks:
  skill-net:
    driver: bridge

# ── Docker Compose Secrets ──────────────────────────────────────────
# Each secret maps to a file under ./secrets/<name>.
# The file content is mounted at /run/secrets/<name> inside the container.
# Application code reads from /run/secrets/<name> first, env var second.
#
# Create the secret files before starting:
#   echo "your-key" > secrets/admin_api_key
#   chmod 600 secrets/*
#
# See secrets/example/ for a full list of expected secrets.
secrets:
  admin_api_key:
    file: ./secrets/admin_api_key
  device_psk:
    file: ./secrets/device_psk
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  wechat_bot_token:
    file: ./secrets/wechat_bot_token
  wechat_ilink_bot_id:
    file: ./secrets/wechat_ilink_bot_id
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  athena_encryption_key:
    file: ./secrets/athena_encryption_key
