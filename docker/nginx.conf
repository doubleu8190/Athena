# ==============================================================================
# Athena v2 生产部署 Nginx 虚拟主机配置
# 负责前端 SPA 静态托管、客户端路由回退、API 反向代理及 SSE 流式传输优化
# ==============================================================================

# 继承上级反向代理（如 AWS ALB、Cloudflare、Traefik 等）的协议标头；
# 若上级未传递 X-Forwarded-Proto 则降级使用当前连接的 $scheme，避免 TLS 卸载后协议被误判为 http 导致后端同源校验拦截
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # 客户端请求体大小上限（64MB，与后端中间件上传大文件/技能包限制保持一致）
    client_max_body_size 64M;

    # --------------------------------------------------------------------------
    # Gzip 压缩配置：减少文本/脚本传输体积，提升弱网及首屏加载体验
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # 静态资源根目录与默认索引文件
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 静态资源长效缓存（带指纹的 JS/CSS/字体/图片）
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 禁用强缓存，确保前端发布新版本时客户端能够及时更新
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # --------------------------------------------------------------------------
    # SPA 客户端路由回退：非静态文件均重定向至 index.html 由 React Router 解析
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Athena SSE 流式响应反向代理（如 /api/v1/sessions/.../runs/.../stream）
    # 必须通过正则 location 优先匹配，防止被通用 /api/ 规则覆盖
    # --------------------------------------------------------------------------
    location ~* ^/api/.*/stream/?$ {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;

        # 透传客户端主机与协议信息，确保 Athena 后端同源/CSRF 安全校验通过
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # SSE 关键优化：
        # 1. proxy_buffering off：彻底关闭代理缓冲，服务端输出事件后立刻推流至浏览器，避免卡顿。
        # 2. proxy_cache off：禁用缓存。
        # 3. proxy_read_timeout 600s：保持长连接存活达 10 分钟，避免复杂推理或工具执行期间被切断。
        # 4. Connection ""：维持 HTTP/1.1 长连接。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # --------------------------------------------------------------------------
    # 通用后端 API 反向代理
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;

        # 透传请求头部以维持同源校验与客户端真实 IP 记录
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 常规 API 请求超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 存活健康检查透传（供负载均衡或容器外部探针监控后端健康状态）
    # --------------------------------------------------------------------------
    location = /health {
        proxy_pass http://backend-api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}
