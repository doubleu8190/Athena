<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Athena target architecture product UI preview" />
    <title>Athena / Workspace preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./product-overrides.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">A</span><span>ATHENA</span><small>WORKSPACE</small></div>
        <button class="new-chat" id="new-chat">＋ New conversation</button>
        <div class="nav-group"><div class="nav-label">WORKSPACE</div><button class="nav-item active" data-view="chat"><span>◒</span>Conversations <b>4</b></button><button class="nav-item" data-view="runs"><span>⌁</span>Runs <b>3</b></button></div>
        <div class="nav-group"><div class="nav-label">KNOWLEDGE</div><button class="nav-item" data-view="knowledge"><span>▤</span>Knowledge bases</button><button class="nav-item" data-view="memory"><span>✦</span>Memory</button><button class="nav-item" data-view="files"><span>□</span>Files</button></div>
        <div class="nav-group"><div class="nav-label">RUNTIME</div><button class="nav-item" data-view="settings"><span>⚙</span>Settings</button></div>
        <div class="recent"><div class="nav-label">RECENT</div><button class="recent-item selected"><i class="live-dot"></i><span><strong>Release readiness audit</strong><small>RUN-8F2A · running</small></span></button><button class="recent-item"><i></i><span><strong>Knowledge base refresh</strong><small>RUN-7C19 · completed</small></span></button></div>
        <div class="sidebar-footer"><span class="online-dot"></span>Runtime connected <span class="version">v1 target</span></div>
      </aside>

      <main class="main">
        <header class="topbar"><div class="breadcrumb"><span>Athena</span><b>/</b><strong id="page-title">Conversations</strong></div><div class="top-actions"><span class="env-pill"><span class="online-dot"></span>LOCAL</span><button class="icon-btn" aria-label="Search">⌕</button><button class="avatar">U</button></div></header>
        <div class="content" id="app-view"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
