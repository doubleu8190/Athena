# nginx.conf — Athena Gateway
#
# Single Nginx instance serves double duty:
#   1. Reverse proxy /api/* and /ws/* to athena-core (FastAPI)
#   2. Serve frontend static files with SPA fallback

upstream athena_backend {
    server athena-core:8000;
}

upstream athena_frontend {
    server athena-frontend:80;
}

server {
    listen 80;
    server_name _;

    # ── API & WebSocket routes → backend ────────────────────────────

    location /api/ {
        proxy_pass http://athena_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support: disable buffering for streaming responses
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_set_header Connection '';
    }

    location /ws/ {
        proxy_pass http://athena_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    location /metrics {
        proxy_pass http://athena_backend;
        proxy_set_header Host $host;
    }

    # ── Frontend static files + SPA fallback ────────────────────────

    location / {
        proxy_pass http://athena_frontend;
        proxy_set_header Host $host;
    }
}
