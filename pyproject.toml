[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "athena-v2"
version = "0.1.0"
description = "面向多用户的通用智能助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "cryptography==50.0.2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx2==2.16.0",
    "jsonschema>=4.26,<5",
    "mcp==2.3.0",
    "python-multipart>=0.0.20,<1",
    "redis>=5,<7",
    "openai==3.46.0",
    "pgvector>=0.4,<1",
    "pydantic>=2.14,<3",
    "pwdlib[argon2]>=0.2,<1",
    "sqlalchemy[asyncio]>=2,<3",
    "sentence-transformers>=5.7,<6",
    "tiktoken>=0.12,<1",
    "transformers>=4.57,<5",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.27,<1",
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
knowledge = [
    "jieba==0.42.1",
    "minio==7.2.20",
    "psutil>=6,<8",
    "paddlepaddle==3.2.2; python_version < '3.14'",
    "paddleocr==3.7.0; python_version < '3.14'",
    "pypdfium2==5.15.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "Pillow==13.0.0",
]

[tool.hatch.build]
dev-mode-dirs = ["backend/src"]

[tool.hatch.build.targets.wheel]
only-include = ["backend/src"]
sources = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "backend/tests", "backend/scripts"]
markers = [
    "integration: requires ATHENA_TEST_DATABASE_URL and PostgreSQL",
    "llm_live: uses a configured real LLM service and is skipped by default",
    "real_ocr: uses the local PaddleOCR model runtime",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "adapter",
    "api",
    "app",
    "bootstrap",
    "common",
    "domain",
    "infrastructure",
    "main",
]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "backend/src:backend/tests:backend/scripts"
files = ["backend/src", "backend/scripts", "backend/tests"]

[[tool.mypy.overrides]]
module = ["minio", "minio.*"]
ignore_missing_imports = true
