[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena"
version = "0.1.0"
description = "Athena - Personal AI Assistant"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "doubleu", email = "doubleu8190@gmail.com"}
]

dependencies = [
    "fastapi==0.137.1",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy==2.0.51",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "redis>=5.0.0,<6",
    "arq>=0.26",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "python-telegram-bot==22.8",
    "docker==7.1.0",
    "jinja2==3.1.6",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
    "prometheus-client==0.25.0",
    "fastmcp>=3.4",
    "cryptography==49.0.0",
    "websockets==16.0",
    "python-multipart==0.0.32",
    "chromadb==1.5.9",
    "sentence-transformers==5.6.0",
    "openai==2.43.0",
    "anthropic==0.111.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langmem>=0.0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx-ws>=0.7.0",
    "fakeredis>=2.26.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "pip-tools>=7.0.0",
]

[project.scripts]
athena-core = "athena.main:main"

[tool.setuptools.packages.find]
include = ["athena*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]
