[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "athena-v2"
version = "0.1.0"
description = "面向多用户的通用智能助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pwdlib[argon2]>=0.2,<1",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.27,<1",
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build]
dev-mode-dirs = ["backend/src"]

[tool.hatch.build.targets.wheel]
only-include = ["backend/src"]
sources = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["integration: requires ATHENA_TEST_DATABASE_URL and PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "adapter",
    "api",
    "app",
    "common",
    "domain",
    "infrastructure",
    "main",
]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "backend/src:backend/tests"
files = ["backend/src", "backend/tests"]
