[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena"
version = "0.1.0"
description = "Athena — 自主 AI Agent 桌面应用"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.0.0",
    "docker>=7.0.0",
    # MCP 客户端基于官方 SDK（client.py 直接导入 mcp）。
    # 此前仅作为 langchain-mcp-adapters 的传递依赖存在，需显式声明以防移除。
    "mcp>=1.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "rapidocr_onnxruntime>=1.2.0",
    "tree-sitter-language-pack>=0.8.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["athena*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
