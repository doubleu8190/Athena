[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena"
version = "0.1.0"
description = "Athena - Personal AI Assistant"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "doubleu", email = "doubleu8190@gmail.com"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
    "httpx>=0.28.0",
    "python-telegram-bot>=21.0",
    "docker>=7.0.0",
    "jinja2>=3.1.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "mcp>=1.0.0",
    "cryptography>=44.0.0",
    "websockets>=14.0",
    "python-multipart>=0.0.20",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx-ws>=0.7.0",
    "fakeredis>=2.26.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "pip-tools>=7.0.0",
]

[project.scripts]
athena-core = "athena.main:main"
athena-worker = "athena.worker:main"

[tool.setuptools.packages.find]
include = ["athena*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]
